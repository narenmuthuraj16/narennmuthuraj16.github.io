<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naren Muthuraj Latha | Portfolio</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.5rem;
      letter-spacing: -0.025em;
    }
    p.role {
      color: var(--accent);
      margin: 0 0 1.25rem 0;
      font-size: 0.95rem;
      font-weight: 500;
    }
    p.desc {
      color: var(--subtext);
      font-size: 0.9rem;
      line-height: 1.5;
      margin: 0 0 2rem 0;
    }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.75rem;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 9999px;
      font-size: 0.8rem;
      margin-bottom: 1.5rem;
    }
    .links a {
      display: inline-block;
      margin: 0 0.5rem;
      color: var(--text);
      text-decoration: none;
      font-size: 0.85rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    .links a:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Comprehensive Portfolio In Progress</div>
    <h1>Naren Muthuraj Latha</h1>
    <p class="role">Hybrid Mechanical-Design Engineer</p>
    <p class="desc">
      Currently curating engineering dossiers, CAD models, and mechatronic systems validation. 
      Full technical site deploying shortly.
    </p>
    <div class="links">
      <a href="mailto:your.email@example.com">Contact Directly</a>
      <a href="https://linkedin.com/in/yourprofile" target="_blank">LinkedIn</a>
    </div>
  </div>
</body>
</html>
